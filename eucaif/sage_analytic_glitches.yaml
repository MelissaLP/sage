# O3a-calibrated analytic glitch population for SAGE, read by sage.data.noise.GlitchPopulation.
#
# Format and calibration method from GWForge (Koustav Chandra et al., MIT,
# https://github.com/koustavchandra/gwforge: GWForge/glitch/configuration_files/blip_tomte.ini and
# docs/source/glitch.md). Blip and Tomte are GWForge's classes and ranges; the rates, frequency
# ranges and SNR indices of every class come, as in GWForge, from the public Gravity Spy O3a tables
# (Zenodo 5649212, doi:10.5281/zenodo.5649212, CC BY 4.0; Glanzer et al. 2023, CQG 40 065004,
# doi:10.1088/1361-6382/acb633), classifications with ml_confidence >= 0.9,
# divided by the GWOSC O3a DATA time (3116 h at H1, 3321 h at L1). eucaif/gravityspy_o3a_rates.py
# recomputes them (and the numbers of every other Gravity Spy class).
#
# Keys of a class:
#   generator   analytic generator in sage.data.noise: sine_gaussian, ringdown, white_noise_burst,
#               gaussian_blip, antiglitch_glitch, scattered_light_arch
#
# Blip, Tomte, BlipLowFrequency and KoiFish use antiglitch_glitch, ported from the Antiglitch
# repository (A. Lundgren, https://github.com/andrew-lundgren/antiglitch, MIT; arXiv:2309.06594);
# their f0 and gbw ranges are the 5th-95th percentiles of Antiglitch's fits to O3 glitches.
#   rate        mean number per hour per detector (Poisson count, uniform times, as GWForge),
#               a number or one per detector; in dense mode (glitches_per_segment) the class mix
#   snr_range   optimal SNR against the detector's ASD, p(snr) ~ snr**-snr_index on snr_range
#   snr_index   (1: log-uniform, 0: uniform). Gravity Spy's indices are Omicron SNRs above 7.5;
#               like GWForge, the range extends below and above.
#   phases      optional discrete phases, GWForge's cosine convention h ~ cos(2 pi f0 (t - t0) + phase)
#   log_uniform parameters drawn log-uniformly on their range (GWForge draws f0 log-uniformly)
#   duration    length (s) of each generated glitch array; the glitch is centred in it
#   parameters  [low, high] or a fixed value, with the generator's own names
#
# Not modelled: Fast_Scattering (7.6/h at L1, the most common L1 class), Low_Frequency_Burst
# (5.8/h at H1), Whistle, Extremely_Loud: no analytic shape for them here.

detectors: [H1, L1]
sample_rate: 4096.0

classes:

  Blip:
    # GWForge's Blip: short broadband bursts, O(10) ms (Cabero et al. 2019, arXiv:1901.05093);
    # symmetric, phase 0 or pi (Antiglitch, arXiv:2309.06594). Gravity Spy O3a: 1.30/h at H1,
    # 0.66/h at L1; peak frequency 93-412 Hz at H1, 111-630 Hz at L1; SNR index 2.32.
    # Shape: Antiglitch's model, f0 and gbw the 5th-95th percentiles of its fits to 1206 O3 Blips
    # (f0 is the bump's centre in strain; the whitened peak is higher, 65-243 Hz in the fits).
    generator: antiglitch_glitch
    rate: {H1: 1.299, L1: 0.655}
    f0: [12.0, 260.0]
    gbw: [0.29, 4.2]
    log_uniform: [f0, gbw]
    phases: [0.0, 3.141592653589793]
    snr_range: [5.0, 200.0]
    snr_index: 2.3
    duration: 0.5

  Tomte:
    # GWForge's Tomte: triangular bursts of ~0.25 s, most power below 64 Hz (Glanzer et al. 2023,
    # arXiv:2208.12849); symmetric, phase pi. Gravity Spy O3a: 0.22/h at H1, 6.28/h at L1; peak
    # frequency 32-61 Hz; SNR index 2.39 (GWForge: 2.0-2.4, uses 2.2).
    # Shape: Antiglitch's model, 5th-95th percentiles of its fits to 686 O3 Tomtes.
    generator: antiglitch_glitch
    rate: {H1: 0.223, L1: 6.276}
    f0: [12.0, 26.0]
    gbw: [1.4, 7.0]
    log_uniform: [f0, gbw]
    phases: [3.141592653589793]
    snr_range: [5.0, 200.0]
    snr_index: 2.2
    duration: 1.0

  BlipLowFrequency:
    # Gravity Spy's Blip_Low_Frequency, with the Blip's phases (our assumption). O3a: 0.45/h at H1,
    # 2.50/h at L1; peak frequency 38-125 Hz; SNR index 4.81 (most are close to Omicron's threshold).
    # Shape: Antiglitch's model, 5th-95th percentiles of its fits to 786 O3 Blip_Low_Frequency.
    generator: antiglitch_glitch
    rate: {H1: 0.451, L1: 2.504}
    f0: [12.0, 48.0]
    gbw: [0.61, 6.4]
    log_uniform: [f0, gbw]
    phases: [0.0, 3.141592653589793]
    snr_range: [5.0, 200.0]
    snr_index: 4.8
    duration: 0.5

  ScatteredLight:
    # Gravity Spy's Scattered_Light as one ArchEnemy arch (Tolley et al. 2023, arXiv:2301.10491);
    # the fringe frequency (top of the arch) follows Omicron's peak frequency. O3a: 3.03/h at H1,
    # 1.90/h at L1; peak frequency 18-38 Hz; SNR index 2.39; Omicron durations 1-8.5 s, capped here
    # at 3.5 s so arches fit in 4 s windows (raise timeperiod and duration for longer windows).
    generator: scattered_light_arch
    rate: {H1: 3.028, L1: 1.898}
    fringe_frequency: [18.5, 37.8]
    timeperiod: [1.8, 3.5]
    snr_range: [5.0, 200.0]
    snr_index: 2.4
    duration: 3.6

  KoiFish:
    # Gravity Spy's Koi_Fish: loud, broadband bursts. O3a: 2.28/h at H1, 1.43/h at L1; peak
    # frequency 40-269 Hz at H1, 32-412 Hz at L1; SNR index 1.35, Omicron SNR 28-624 (5-95 %), so
    # snr_range starts at 20. Random phase (no Gravity Spy or Antiglitch preference assumed).
    # Shape: Antiglitch's model, 5th-95th percentiles of its fits to 1196 O3 Koi_Fish.
    generator: antiglitch_glitch
    rate: {H1: 2.281, L1: 1.434}
    f0: [10.0, 168.0]
    gbw: [0.31, 7.5]
    log_uniform: [f0, gbw]
    snr_range: [20.0, 1000.0]
    snr_index: 1.35
    duration: 0.5

  # McGAN's training shapes (McGinn et al. 2021, CQG 38 155005): no Gravity Spy counterpart, so
  # rate 0 (never drawn). Give them a rate or a weight to use them.
  Ringdown:
    generator: ringdown
    rate: 0.0
    f0: [70.0, 250.0]
    q: [9.0, 20.0]
    snr_range: [5.0, 200.0]
    snr_index: 2.2
    duration: 1.0

  WhiteNoiseBurst:
    generator: white_noise_burst
    rate: 0.0
    tau: [1.0e-4, 1.0e-2]
    band: [70.0, 250.0]
    snr_range: [5.0, 200.0]
    snr_index: 2.2
    duration: 1.0

  GaussianBlip:
    generator: gaussian_blip
    rate: 0.0
    tau: [0.01, 0.05]
    snr_range: [5.0, 200.0]
    snr_index: 2.2
    duration: 1.0
