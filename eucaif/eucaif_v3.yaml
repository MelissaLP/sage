# EuCAIF dataset v3: real detector noise (GWOSC open data, or frames on a LIGO/Virgo cluster) with BBH and
# glitch injections, for training on the fly. Read by eucaif/v3; instructions in eucaif/v3/README.md.
# Built in stages: this file holds the sections implemented so far.
data:
  detectors: [H1, L1]            # any of H1, L1, V1 (V1: O3 only)
  runs: [O3a, O3b, O4a]          # GWOSC observing runs
  sample_rate: 2048              # Hz, after resampling (sage.dsp.decimate; power-of-2 ratio to the source rate)
sources:                         # eucaif/v3/sources.py; tried in this order (the next if one fails)
  order: [gwosc, frames]
  gwosc:
    sample_rate: 16384           # default; same decimation as frames (x8 to 2048 Hz). 4096 also works (4x less
                                 # to download) but changes the decimation: GWOSC's own filter, then x2 here
  frames:                        # on a LIGO/Virgo cluster: TimeSeries.get(channel, frametype=...)
    # EXAMPLES ONLY: set the channel and frame type of the calibration you want on your cluster
    channels: {H1: H1:GDS-CALIB_STRAIN_CLEAN, L1: L1:GDS-CALIB_STRAIN_CLEAN, V1: V1:Hrec_hoft_16384Hz}
    frametypes: {H1: H1_HOFT_C00, L1: L1_HOFT_C00, V1: HoftOnline}
cache:                           # filled once by `python -m eucaif.v3.sources download` (HTCondor: v3/download.sub)
  directory: v3_cache            # decimated float32 pieces + provenance; put it on shared disk on a cluster
  chunk_seconds: 4096            # GPS-aligned chunk = one GWOSC file, downloaded once
  margin_seconds: 0.0            # extra data around each piece for the decimation (>0 costs a 2nd GWOSC file)
  fetch_missing: false           # training reads only the cache (true: fetch missing pieces on the fly)
segments:
  min_length: 32.0               # s of contiguous good time a window needs (PSD context + frame); shorter
                                 # stretches are not used
  veto:                          # every GWOSC event (all catalogues) removed over [t - before, t + after] s
    before: 30.0
    after: 10.0
  file: v3/segments_HL.json      # written by `python -m eucaif.v3.segments eucaif/eucaif_v3.yaml --out ...`
split:
  mode: gps_blocks               # gps_blocks: disjoint GPS blocks per split; random: every split draws anywhere
                                 # (as ggwd FM production; splits may share data). Windows keep their GPS time.
  block_seconds: 4096            # gps_blocks only
  fractions: {train: 0.8, validation: 0.1, test: 0.1}
  seed: 0
glitch_tags:                     # labelled real glitches, to tag (not remove) windows; empty: no tags
  - path: gravityspy/H1_O3a.csv  # Gravity Spy, Zenodo 5649212 (H1/L1, O3a/O3b)
    detector_column: ifo
    gps_column: event_time
    label_column: ml_label
    confidence_column: ml_confidence
    min_confidence: 0.9
whitening:                       # eucaif/v3/whitening.py; new methods plug in with @register
  method: fir                    # fir: FIRWhitening (gwpy's whiten) with each window's own ASD
                                 # fiducial: SAGE main's FD division by a fixed ASD per detector
  fduration: 4.0                 # fir: s, FIR filter length (drops fduration / 2 at each end)
  highpass: 15.0                 # Hz
  output_dtype: float32          # filtering is float64; output stored as float32
  # fiducial only: fiducial_dir (SAGE main's fiducial_{det}_psd.bin/.json) or asd_file (.npz with detectors,
  # frequencies, asd), and pad_seconds (edges dropped, default 2)
